name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kora_test
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kora -d kora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost 127.0.0.1
      DATABASE_URL: postgresql://kora:kora_test_password@localhost:5432/kora_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: python manage.py check

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test
