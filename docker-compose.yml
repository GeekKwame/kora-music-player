services:
  db:
    image: postgres:16-alpine
    container_name: kora_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-kora_db}
      POSTGRES_USER: ${DB_USER:-kora_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kora_password123}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

  
