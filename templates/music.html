{% extends 'base.html' %}
{% load static %}

{% block title %}Kora - Now Playing{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
  <a href="{% url 'home' %}" class="btn btn-ghost" style="padding: 6px 14px; font-size: var(--font-size-xs); color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Return to Home
  </a>
</div>

<div class="standalone-player-wrapper" role="region" aria-label="Now Playing Full Screen View">
  <!-- Glowing Album Artwork -->
  <div class="standalone-cover-wrapper">
    <img 
      src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=80" 
      alt="Now playing album artwork" 
      class="standalone-cover-img"
      id="standalone-cover"
    >
  </div>

  <!-- Song Information -->
  <h1 class="standalone-track-title" id="standalone-title">African Lofi Experience</h1>
  <p class="standalone-artist-name" id="standalone-artist">Kora Sounds • Afro-Chills Vol. 1</p>

  <!-- Large Center Playback Controls -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 28px;">
    <button type="button" class="btn-icon" id="standalone-shuffle-btn" aria-label="Shuffle playback">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
    </button>

    <button type="button" class="btn-icon" id="standalone-prev-btn" aria-label="Previous track" style="width: 48px; height: 48px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="19 20 9 12 19 4 19 20"></polygon>
        <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
      </svg>
    </button>

    <button type="button" class="btn-primary" id="standalone-play-btn" aria-label="Play or pause track" style="width: 58px; height: 58px; border-radius: var(--radius-full); padding: 0;">
      <svg id="standalone-play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <svg id="standalone-pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    </button>

    <button type="button" class="btn-icon" id="standalone-next-btn" aria-label="Next track" style="width: 48px; height: 48px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="5 4 15 12 5 20 5 4"></polygon>
        <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
      </svg>
    </button>

    <button type="button" class="btn-icon" id="standalone-repeat-btn" aria-label="Repeat track">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>
  </div>

  <!-- Scrubbing Progress Bar -->
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
    <span style="font-size: var(--font-size-xs); color: var(--text-dim); min-width: 34px;" id="standalone-curr-time">0:00</span>
    <div class="player-progress-bar" id="standalone-progress-bar" role="progressbar" aria-label="Playback track position" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="height: 6px;">
      <div class="player-progress-fill" id="standalone-progress-fill" style="width: 0%;"></div>
    </div>
    <span style="font-size: var(--font-size-xs); color: var(--text-dim); min-width: 34px;" id="standalone-total-time">3:45</span>
  </div>

  <!-- Extra Controls -->
  <div style="display: flex; justify-content: center; gap: 16px;">
    <a href="{% url 'search' %}?q=Afrobeats" class="btn btn-secondary" style="font-size: var(--font-size-xs); padding: 8px 16px;">
      Discover More Soundscapes
    </a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Link standalone full-screen controls to global audio engine
  (function() {
    const sPlayBtn = document.getElementById('standalone-play-btn');
    const sPlayIcon = document.getElementById('standalone-play-icon');
    const sPauseIcon = document.getElementById('standalone-pause-icon');
    const sPrevBtn = document.getElementById('standalone-prev-btn');
    const sNextBtn = document.getElementById('standalone-next-btn');
    const sRepeatBtn = document.getElementById('standalone-repeat-btn');
    const sShuffleBtn = document.getElementById('standalone-shuffle-btn');
    const sCover = document.getElementById('standalone-cover');
    const sTitle = document.getElementById('standalone-title');
    const sArtist = document.getElementById('standalone-artist');
    const sCurrTime = document.getElementById('standalone-curr-time');
    const sTotalTime = document.getElementById('standalone-total-time');
    const sProgressFill = document.getElementById('standalone-progress-fill');
    const sProgressBar = document.getElementById('standalone-progress-bar');

    function syncTrackInfo(track) {
      if (!track) return;
      if (sTitle && track.name) sTitle.textContent = track.name;
      if (sArtist && track.artist) sArtist.textContent = track.artist;
      if (sCover && track.image) sCover.src = track.image;
      if (sTotalTime && track.duration) sTotalTime.textContent = track.duration;
    }

    function syncPlayState(isPlaying) {
      if (sPlayIcon && sPauseIcon) {
        sPlayIcon.style.display = isPlaying ? 'none' : 'block';
        sPauseIcon.style.display = isPlaying ? 'block' : 'none';
      }
      if (sCover) {
        if (isPlaying) {
          sCover.style.boxShadow = '0 12px 40px rgba(229, 169, 59, 0.4)';
          sCover.style.transform = 'scale(1.02)';
        } else {
          sCover.style.boxShadow = '0 8px 30px rgba(0, 0, 0, 0.5)';
          sCover.style.transform = 'scale(1)';
        }
        sCover.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
      }
    }

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // Initial sync
    if (window.koraPlayer) {
      syncTrackInfo(window.koraPlayer.getCurrentTrack());
      syncPlayState(window.koraPlayer.isPlaying());
    }

    // Listen to custom player events
    window.addEventListener('kora:trackchange', function(e) {
      syncTrackInfo(e.detail);
    });

    window.addEventListener('kora:playstate', function(e) {
      syncPlayState(e.detail.isPlaying);
    });

    window.addEventListener('kora:timeupdate', function(e) {
      const detail = e.detail;
      if (sCurrTime) sCurrTime.textContent = formatTime(detail.currentTime);
      if (sTotalTime && detail.duration) sTotalTime.textContent = formatTime(detail.duration);
      if (sProgressFill && detail.percent !== undefined) sProgressFill.style.width = detail.percent + '%';
      if (sProgressBar) sProgressBar.setAttribute('aria-valuenow', Math.round(detail.percent || 0));
    });

    // Control clicks
    if (sPlayBtn) {
      sPlayBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (window.koraPlayer) window.koraPlayer.togglePlay();
      });
    }

    if (sPrevBtn) {
      sPrevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (window.koraPlayer) window.koraPlayer.prev();
      });
    }

    if (sNextBtn) {
      sNextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (window.koraPlayer) window.koraPlayer.next();
      });
    }

    if (sProgressBar) {
      sProgressBar.addEventListener('click', function(e) {
        e.stopPropagation();
        const rect = sProgressBar.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (window.koraPlayer) window.koraPlayer.seek(ratio * 100);
      });
    }

    if (sRepeatBtn) {
      let isLoop = false;
      sRepeatBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const audio = window.koraPlayer ? window.koraPlayer.getAudio() : null;
        if (audio) {
          audio.loop = !audio.loop;
          isLoop = audio.loop;
          sRepeatBtn.style.color = isLoop ? 'var(--accent-gold)' : 'inherit';
        }
      });
    }

    if (sShuffleBtn) {
      sShuffleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (window.koraPlayer) window.koraPlayer.next();
      });
    }
  })();
</script>
{% endblock %}
