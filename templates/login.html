{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kora - Sign In</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.4/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black h-screen flex flex-col items-center justify-center">
  <div class="w-full max-w-xs px-6">
    <div class="mb-8 flex flex-col items-center">
      <img src="{% static 'kora_logo.png' %}" alt="Kora Logo" class="w-28 h-28 object-contain">
      <h1 class="text-3xl text-white font-bold mt-2">Kora</h1>
    </div>
    <form class="bg-black">
      <div class="mb-4">
        <input class="bg-gray-800 text-white border border-gray-600 rounded py-2 px-4 block w-full appearance-none leading-normal" type="text" placeholder="Username">
      </div>
      <div class="mb-6">
        <input class="bg-gray-800 text-white border border-gray-600 rounded py-2 px-4 block w-full appearance-none leading-normal" type="password" placeholder="Password">
      </div>
      <button class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded w-full mb-4">Sign In</button>
      <p class="text-center text-gray-400 text-xs">
        Don't have an account?<a href="#" class="text-yellow-500 hover:underline"> Sign up</a>
      </p>
    </form>
    <p class="text-center text-gray-500 text-xs mt-4">
      &copy; Kora
    </p>
  </div>
</body>
</html>
